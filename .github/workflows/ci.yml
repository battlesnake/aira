name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + vet + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: build
        run: make build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Real-cgroup tests (SkipOrFailRealCgroup) and real-pytest tests
      # (requireRealPytest) skip on a generic runner: they hard-fail only under
      # AIRA_REAL_CGROUP=1 / AIRA_REAL_PYTEST=1, which this job does not set. The
      # rest of the pure-Go suite runs.
      - name: go test
        run: make test

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # AIRA-20. Every wall-clock deadline in internal/runner, internal/daemon
      # and internal/pylib now routes through internal/testdeadline: a liveness
      # backstop ("did this ever happen?") floors at 5s and scales by a further
      # 4x under -race; a latency assertion ("was this prompt?") scales without
      # a floor; a negative wait ("did this correctly NOT happen?") is left as
      # plain time.After, since contention delays the subject and the timer
      # alike. governor_slot_test.go, the one file AIRA-20 deliberately left
      # unhardened, was deleted whole by AIRA-33 along with the one test this
      # job could not honestly pass (TestRealPytestRAMForkDoesNotPinHelperStdin,
      # load-flaky on production code — a hardcoded process.wait(timeout=1.0) in
      # the xdist governor — inside AIRA-33's own deletion scope).
      #
      # Real-cgroup tests (SkipOrFailRealCgroup) and real-pytest tests
      # (requireRealPytest) skip here exactly as in the `test` job above: this
      # runner has no delegated memory controller to hand them, and
      # AIRA_REAL_CGROUP / AIRA_REAL_PYTEST are unset.
      - name: go test -race
        run: make race
