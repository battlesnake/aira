name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + vet + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: build
        run: make build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Real-cgroup tests (SkipOrFailRealCgroup) and real-pytest tests
      # (requireRealPytest) skip on a generic runner: they hard-fail only under
      # AIRA_REAL_CGROUP=1 / AIRA_REAL_PYTEST=1, which this job does not set. The
      # rest of the pure-Go suite runs.
      - name: go test
        run: make test
      # NOTE: no `-race` job here on purpose. The repo's gate is `make ci`
      # (build + vet + gofmt + test, no -race); `make race` is a local dev
      # target. Under -race's slowdown on a shared CI runner, tests with
      # wall-clock latency assertions flake despite there being no actual data
      # race.
      #
      # AIRA-20's hardening pass has LANDED, so that half of the precondition is
      # met: every deadline in internal/runner, internal/daemon and
      # internal/pylib now goes through internal/testdeadline, which scales by 4x
      # under -race, and `make race` is green on internal/daemon and
      # internal/runner locally.
      #
      # AIRA-33 has LANDED, which clears the named blocker: the one remaining
      # flake was TestRealPytestRAMForkDoesNotPinHelperStdin, load-flaky on a
      # hardcoded process.wait(timeout=1.0) inside the xdist governor, and that
      # test and that production code were both deleted with the plugin.
      #
      # This job is still NOT re-added here, deliberately. Turning -race on is
      # AIRA-20's own ticket, and AIRA-20 records further wall-clock-tight tests
      # in internal/runner beyond the one AIRA-33 removed. Enabling it in the
      # deletion PR would be claiming green for a suite whose flake inventory
      # nobody has re-measured — exactly what the paragraph above forbids. What
      # remains is AIRA-20's measurement, not a blocked precondition.
