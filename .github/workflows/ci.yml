name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + vet + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: build
        run: make build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Real-cgroup tests (SkipOrFailRealCgroup) and real-pytest tests
      # (requireRealPytest) skip on a generic runner: they hard-fail only under
      # AIRA_REAL_CGROUP=1 / AIRA_REAL_PYTEST=1, which this job does not set. The
      # rest of the pure-Go suite runs.
      - name: go test
        run: make test
      # NOTE: no `-race` job here on purpose. The repo's gate is `make ci`
      # (build + vet + gofmt + test, no -race); `make race` is a local dev
      # target. Under -race's slowdown on a shared CI runner, tests with
      # wall-clock latency assertions flake despite there being no actual data
      # race.
      #
      # AIRA-20's hardening pass has LANDED, so that half of the precondition is
      # met: every deadline in internal/runner, internal/daemon and
      # internal/pylib now goes through internal/testdeadline, which scales by 4x
      # under -race, and `make race` is green on internal/daemon and
      # internal/runner locally.
      #
      # What still blocks the job is one named test, not the pass:
      # TestRealPytestRAMForkDoesNotPinHelperStdin remains load-flaky on its
      # SIGTERM budget (AIRA-65), which is a hardcoded process.wait(timeout=1.0)
      # in the xdist governor — production code inside AIRA-33's deletion scope,
      # so hardening it would be thrown away. Re-adding -race before AIRA-33
      # lands would declare clean a suite that still contains a known flake, so
      # it waits for AIRA-33 (itself blocked on AIRA-91) or for an explicit
      # quarantine of that one test, said out loud rather than done silently.
